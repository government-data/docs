name: CI

# The site (tests, and the build of both targets: the installation's and the
# public site's, with its checks) and the image, on every pull request and on
# a manual run. The image is built, not pushed, and kept as a workflow
# artifact for a week: `gh run download -n image-docs`, then
# `docker load -i qd-docs.tar`.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # action-setup reads pnpm's version from package.json (packageManager)
      # and runs before setup-node so the pnpm store cache resolves.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm run test
      - name: Build (installation)
        run: pnpm run build
      # The public site at a placeholder URL: pages.yml builds it at
      # DOCS_PUBLIC_URL. Its checks include that no file names the domain.
      - name: Build (public)
        env:
          DOCS_TARGET: public
          DOCS_PUBLIC_URL: https://guide.example.org
          DOCS_ORG_URL: https://github.com/example-org
        run: |
          rm -rf dist
          pnpm run build
          scripts/check-public.sh dist "$DOCS_PUBLIC_URL"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: qd-docs:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/qd-docs.tar
          cache-from: type=gha,scope=image-docs
          cache-to: type=gha,scope=image-docs,mode=max
      # The image serves the guide and answers its health page.
      - name: Check the image
        run: |
          docker load -i "${{ runner.temp }}/qd-docs.tar"
          docker run -d --name qd-docs -p 8080:8080 "qd-docs:${{ github.sha }}"
          trap 'docker rm -f qd-docs >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/docs/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/docs/healthz
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/guide/overview/
          curl -fsS -o /dev/null http://127.0.0.1:8080/docs/es/guide/overview/
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/missing/)" = 404
      - name: Keep the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-docs
          path: ${{ runner.temp }}/qd-docs.tar
          retention-days: 7
          if-no-files-found: error
