# The guide's static site, served under /docs/ on port 8080 (the image runs
# nginx as a non-root user, which cannot bind a port below 1024). The
# installation's edge terminates TLS, checks the session and forwards plain
# HTTP here, so this server does no TLS and no sign-in.

server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Behind the edge: redirects keep the scheme and host the browser used.
    absolute_redirect off;

    root /usr/share/nginx/html;

    location = /docs {
        return 301 /docs/;
    }

    # Hashed build assets never change: cache them hard.
    location /docs/_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every page is a folder with its index.html; what does not exist gets
    # the guide's own 404 page.
    location /docs/ {
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # The health check of module.yaml and of the image.
    location = /docs/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
